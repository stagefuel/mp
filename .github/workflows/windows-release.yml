# .github/workflows/windows-release.yml
# builds the windows exe (and a linux x11 binary) for this fork and attaches them, plus the matching source, to the
# release that triggered it.
# publishing a release triggers it; it can also be run by hand on any branch/tag to test the builds without a release
# (the files are then kept as workflow artifacts instead). nothing runs on pushes or on a schedule.
name: release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: branch or tag to build
        required: true
        default: linux

permissions:
  contents: write  # upload the release assets

jobs:
  dictionary:
    # built once from JMdict and shared by every build (upstream's download link is gone). plain ubuntu python, so
    # the flatpak build container's python doesn't need requests/lxml
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: build the dictionary
        run: |
          pip install requests lxml platformdirs
          PYTHONPATH=src python -m meikipop.scripts.build_dictionary
          cp "$(PYTHONPATH=src python -c 'from meikipop.utils.paths import paths; print(paths.dictionary_path)')" dictionary.pkl

      - uses: actions/upload-artifact@v4
        with:
          name: dictionary
          path: dictionary.pkl
          retention-days: 3

  build-windows:
    runs-on: windows-latest
    needs: dictionary
    env:
      TAG: ${{ github.event.release.tag_name || inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: dictionary
          path: src/meikipop/resources

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: build with pyinstaller
        run: pyinstaller --noconfirm meikipop.win.x64.spec

      - name: smoke test (the bundled exe starts and every OCR provider can be imported)
        shell: pwsh
        run: |
          $out = & dist\meikipop.exe --help 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'usage: meikipop') { throw "meikipop.exe --help failed" }
          & dist\meikipop.exe self-test
          if ($LASTEXITCODE -ne 0) { throw "meikipop.exe self-test failed (a module missing from the spec?)" }

      - name: package
        shell: pwsh
        run: |
          Rename-Item dist\meikipop.exe "meikipop-$env:TAG-windows-x64.exe"
          git archive --format=zip --prefix="meikipop-$env:TAG/" -o "dist\meikipop-$env:TAG-source.zip" HEAD
          Get-FileHash "dist\meikipop-$env:TAG-windows-x64.exe" -Algorithm SHA256 | Format-List

      - name: attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:TAG "dist\meikipop-$env:TAG-windows-x64.exe" "dist\meikipop-$env:TAG-source.zip" --clobber

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: windows-x64
          path: dist/meikipop-*-windows-x64.exe
          retention-days: 7

  build-linux:
    # single-file x86_64 binary for X11 sessions (on Wayland, run from source / Flatpak - see LINUX.md)
    runs-on: ubuntu-22.04  # older glibc, so the binary runs on current distros too
    needs: dictionary
    env:
      TAG: ${{ github.event.release.tag_name || inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: dictionary
          path: src/meikipop/resources

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: system libraries (qt xcb platform, virtual display for the self-test)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libegl1

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: build with pyinstaller
        run: pyinstaller --noconfirm meikipop.linux.x64.spec

      - name: smoke test (starts, every OCR provider can be imported)
        shell: bash
        run: |
          xvfb-run -a dist/meikipop --help 2>&1 | tee help.txt
          grep -q "usage: meikipop" help.txt
          xvfb-run -a dist/meikipop self-test 2>&1

      - name: attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv dist/meikipop "dist/meikipop-$TAG-linux-x64"
          sha256sum "dist/meikipop-$TAG-linux-x64"
          gh release upload "$TAG" "dist/meikipop-$TAG-linux-x64" --clobber

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: linux-x64
          path: dist/meikipop
          retention-days: 7

  build-flatpak:
    # flatpak bundle (KDE runtime): the way to run it on Wayland, incl. screen capture and the KWin cursor
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    needs: dictionary
    env:
      TAG: ${{ github.event.release.tag_name || inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: dictionary
          path: src/meikipop/resources

      - name: generate python flatpak dependencies
        run: python3 flatpak/gen_deps.py

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: meikipop-${{ github.event.release.tag_name || inputs.ref }}-linux-x64.flatpak
          manifest-path: flatpak/manifest.yml
          upload-artifact: ${{ github.event_name != 'release' }}

      - name: attach to the release
        if: github.event_name == 'release'
        # plain curl: the flatpak build image doesn't necessarily have the gh cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ github.event.release.upload_url }}
        run: |
          FILE="meikipop-$TAG-linux-x64.flatpak"
          sha256sum "$FILE"
          curl --fail -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
            --data-binary @"$FILE" "${UPLOAD_URL%\{*}?name=$FILE" > /dev/null
