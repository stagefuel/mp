# .github/workflows/windows-release.yml
# builds the windows exe for this fork and attaches it (plus the matching source) to the release that triggered it.
# publishing a release is the only trigger, so nothing runs on pushes or on a schedule.
name: windows release build

on:
  release:
    types: [published]

permissions:
  contents: write  # upload the release assets

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: build with pyinstaller
        run: pyinstaller --noconfirm meikipop.win.x64.spec

      - name: smoke test (the bundled exe starts and every OCR provider can be imported)
        shell: pwsh
        run: |
          $out = & dist\meikipop.exe --help 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'usage: meikipop') { throw "meikipop.exe --help failed" }
          & dist\meikipop.exe self-test
          if ($LASTEXITCODE -ne 0) { throw "meikipop.exe self-test failed (a module missing from the spec?)" }

      - name: package
        shell: pwsh
        run: |
          Rename-Item dist\meikipop.exe "meikipop-$env:TAG-windows-x64.exe"
          git archive --format=zip --prefix="meikipop-$env:TAG/" -o "dist\meikipop-$env:TAG-source.zip" HEAD
          Get-FileHash "dist\meikipop-$env:TAG-windows-x64.exe" -Algorithm SHA256 | Format-List

      - name: attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:TAG "dist\meikipop-$env:TAG-windows-x64.exe" "dist\meikipop-$env:TAG-source.zip" --clobber
