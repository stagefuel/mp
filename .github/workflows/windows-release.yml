# .github/workflows/windows-release.yml
# builds the windows exe for this fork and attaches it (plus the matching source) to the release that triggered it.
# (the linux branch's version of this file also builds the linux binary and the flatpak.)
# publishing a release triggers it; it can also be run by hand on any branch/tag to test the builds without a release
# (the files are then kept as workflow artifacts instead). nothing runs on pushes or on a schedule.
name: release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: branch or tag to build
        required: true
        default: main

permissions:
  contents: write  # upload the release assets

jobs:
  dictionary:
    # built once from JMdict and shared by every build (upstream's download link is gone). plain ubuntu python, so
    # the flatpak build container's python doesn't need requests/lxml
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: build the dictionary
        run: |
          pip install requests lxml platformdirs
          PYTHONPATH=src python -m meikipop.scripts.build_dictionary
          cp "$(PYTHONPATH=src python -c 'from meikipop.utils.paths import paths; print(paths.dictionary_path)')" dictionary.pkl

      - uses: actions/upload-artifact@v4
        with:
          name: dictionary
          path: dictionary.pkl
          retention-days: 3

  build-windows:
    runs-on: windows-latest
    needs: dictionary
    env:
      TAG: ${{ github.event.release.tag_name || inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: dictionary
          path: src/meikipop/resources

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: build with pyinstaller
        run: pyinstaller --noconfirm meikipop.win.x64.spec

      - name: smoke test (the bundled exe starts and every OCR provider can be imported)
        shell: pwsh
        run: |
          $out = & dist\meikipop.exe --help 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'usage: meikipop') { throw "meikipop.exe --help failed" }
          & dist\meikipop.exe self-test
          if ($LASTEXITCODE -ne 0) { throw "meikipop.exe self-test failed (a module missing from the spec?)" }

      - name: package
        shell: pwsh
        run: |
          Rename-Item dist\meikipop.exe "meikipop-$env:TAG-windows-x64.exe"
          git archive --format=zip --prefix="meikipop-$env:TAG/" -o "dist\meikipop-$env:TAG-source.zip" HEAD
          Get-FileHash "dist\meikipop-$env:TAG-windows-x64.exe" -Algorithm SHA256 | Format-List

      - name: attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:TAG "dist\meikipop-$env:TAG-windows-x64.exe" "dist\meikipop-$env:TAG-source.zip" --clobber

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: windows-x64
          path: dist/meikipop-*-windows-x64.exe
          retention-days: 7
